name: Archive HMIS hydro-meteorological data

on:
  workflow_dispatch:
    inputs:
      lookback:
        description: Rainfall history window
        required: true
        type: choice
        default: last24hours
        options:
          - last24hours
          - last7days
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: rainfall-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HMIS_PROXY_URL: https://cors.tools/proxy

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Select history window
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            echo "LOOKBACK=last7days" >> "${GITHUB_ENV}"
          else
            echo "LOOKBACK=${{ inputs.lookback || 'last24hours' }}" >> "${GITHUB_ENV}"
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch and normalize rainfall
        run: python scripts/archive_rainfall.py --lookback "${LOOKBACK}"

      - name: Fetch and normalize other sensors
        run: python scripts/archive_sensors.py

      - name: Commit archive changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi
          git commit -m "Update HMIS rainfall archive"
          git push

      - name: Close recovered failure issue
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Rainfall archive failure";
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const issue = issues.find((item) => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Archive recovered in [run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

      - name: Report archive failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Rainfall archive failure";
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "The HMIS rainfall archive workflow failed.",
              "",
              `- Run: ${runUrl}`,
              `- Event: ${context.eventName}`,
              `- Lookback: ${process.env.LOOKBACK || "unknown"}`,
              `- Repository: ${owner}/${repo}`,
            ].join("\n");
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            const issue = issues.find((item) => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "open",
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
            }
